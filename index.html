<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Geospatial Centroid GitHub Portfolio</title>
    
    
    <script type="text/javascript" src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script type="text/javascript" src='plugins/leaflet/Leaflet.markercluster-1.4.1/dist/leaflet.markercluster.js'></script>
    <link rel="stylesheet" href="plugins/leaflet/Leaflet.markercluster-1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="plugins/leaflet/Leaflet.markercluster-1.4.1/dist/MarkerCluster.Default.css">

    <!-- from https://jqueryui.com/download/ -->
    <link rel="stylesheet" href="plugins/jquery-ui/jquery-ui.css">


    <script src="plugins/jquery-ui/external/jquery/jquery.js"></script>
    <script src="plugins/jquery-ui/jquery-ui.js"></script>

     <script src="plugins/moment.js"></script>

    <script type="text/javascript" src="plugins/jquery/jquery.datetimepicker.js"></script>
    <script type="text/javascript" src="plugins/jquery/jquery.datetimepicker.full.min.js"></script>
    <link rel="stylesheet" href="plugins/jquery/jquery.datetimepicker.css">

    <script type="text/javascript" src="plugins/jquery/jquery.cookie.js"></script>

    <script src="plugins/jquery.csv.js"></script>

    <!--bootstrap-->
    <link href="plugins/bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <script src="plugins/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
    <script src="plugins/rison.js"></script>
    <script src="plugins/turf.min.js"></script>
    <script src="js/index.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/layer_manager.js"></script>
    <script src="js/map_manager.js"></script>
    <link rel="stylesheet" href="css/style.css" />
<body>
<div class="overlay">
    <div class="progress">
          <div id="loader" class="progress-bar progress-bar-success progress-bar-striped active align-middle bg-info" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%">
            <span id="current-progress"></span>
          </div>
    </div>
</div>
<div class="container">
    <div class="row">
        <div class="col d-flex justify-content-between">
<!--             <span class="header_text"></span>-->
            <div id="git_but" ><a class="btn btn-default" href="https://github.com/GeospatialCentroid/GeospatialCentroid.github.io" target="git" data-toggle="tooltip" title="Go to Git Repo" data-original-title="Go to git Repo"><i class="bi bi-github"></i></a></div>
        </div>
    </div>
    <div class="row">
        <div class="col">
               <div id="map_wrapper" >
                    <div id="map"></div>
                </div>
        </div>
    </div>

      <div class="row ">
        <div class="col-md-4 " >
          <div id="search_panel_wrapper" class="tab_panel">
                    <div id="side_header">

                        <div class="input-group search_wrapper">
                          <input id="search" type="text" class="form-control" placeholder="">
                          <div class="input-group-append">
                            <button class="btn  btn-primary" type="button" id="search_but"> <i class="bi bi-search"></i></button>
                          </div>
                        </div>

                         <div id="filter_box"></div>
                    </div>



                    <div id='browse_wrapper' >
                        <div id="browse_panel">
                             <div id="filter_area">
                                <div id="filters" class="ui-widget" ></div>
                            </div>
                        </div>
                    </div>
               </div>
        </div>
        <div class="col-md-8">
            <div class="row">
                <div class="col">
                    <label class="form-label" >Projects <span class="total_results"></span></label>
                </div>
                <div class="col text-end">
                     <label for="list_sort" id="sort-title">Sort:</label>
                            <select id="list_sort">
<!--                                <option value="">Default</option>-->
                                <option value="asc">Title (A-Z)</option>
                                <option value="desc">Title (Z-A)</option>
                            </select>
                </div>
                 <div class="col text-end">
                    <div class="btn-group " data-toggle="buttons">
                       <input type="radio" name="options" id="option1" class="radio_item" checked></span>
                        <label class="btn btn-primary active label_item left-btn" for="option1" onclick="change_view('list')"> <i class="bi bi-list checked"></i></label>
                        <input type="radio" name="options" id="option2" class="radio_item" ></span>
                        <label class="btn btn-primary active label_item" for="option2" onclick="change_view('grid')"><i class="bi bi-grid-3x2-gap-fill" ></i></label>

                    </div>
                 </div>

            </div>
           <div id="results">
                    <div >
                        <div id="results_view"></div>

                    </div>
                </div>
        </div>

   </div>

  <div class="org_text">Developed by: <a href="https://gis.colostate.edu/" target="_blank">The Geospatial Centroid</a></div>
</div>
</body>
</html>
